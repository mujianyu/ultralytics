val: datasets/drone2/images/val # val images (relative to 'path') 4 images
test : datasets/drone2/images/test
# val: /home/mjy/ultralytics/datasets/OBB_Crop/images/test
train_ir: datasets/drone2/image/train # train images (relative to 'path') 4 images
val_ir: datasets/drone2/image/val # val images (relative to 'path') 4 images
